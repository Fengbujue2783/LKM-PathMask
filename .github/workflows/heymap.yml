name: Build heymap.ko for MuMu x86_64

on:
  push:
    branches: [ mumu-x86, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update -q && sudo apt-get install -y -q bc bison flex libelf-dev libssl-dev cpio kmod

      - name: Full kernel build with MuMu config (crc-aligned Module.symvers)
        run: |
          set -e
          curl -sL --retry 3 -o linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.90.tar.xz || curl -sL --retry 3 -o linux.tar.xz https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.1.90.tar.xz
          tar xf linux.tar.xz
          cp heymap/mumu.config linux-6.1.90/.config
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf+"/' linux-6.1.90/.config
          cd linux-6.1.90
          # replace the Android-clang version string so kbuild accepts host clang
          sed -i "s/^CONFIG_CC_VERSION_TEXT=.*/CONFIG_CC_VERSION_TEXT=\"clang version 18.1.8\"/" .config
          # LTO vars absent in host env; disable LTO deps if present
          sed -i "s/^CONFIG_LTO_CLANG=.*/# CONFIG_LTO_CLANG is not set/" .config || true
          # defuse options unsupported outside android build
          for opt in CONFIG_CC_IS_GCC CONFIG_PGO_CLANG CONFIG_BUILDTIME_TABLE_SORT; do
            grep -q "^$opt=" .config && sed -i "s/^$opt=.*/# $opt is not set/" .config || true
          done
          make ARCH=x86_64 olddefconfig prepare -j"$(nproc)" 2>/dev/null || true
          make -j"$(nproc)" vmlinux modules_prepare 2>&1 | tail -3
          ls -la Module.symvers include/generated/utsrelease.h 2>/dev/null || true
          cat include/generated/utsrelease.h

      - name: Build heymap.ko
        run: |
          cd heymap
          make KDIR="$(realpath ../linux-6.1.90)"
          ls -la heymap.ko

      - name: Show module metadata
        run: |
          cd heymap
          modinfo heymap.ko || true
          readelf -V heymap.ko 2>/dev/null | head -20 || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: heymap-ko
          path: heymap/heymap.ko
